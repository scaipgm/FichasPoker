<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Chip & Action Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .felt-bg { background: radial-gradient(circle, #064e3b 0%, #022c22 100%); }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- HEADER / LOBBY STATUS -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🃏</span>
            <h1 class="font-bold text-lg text-emerald-400">Poker Chip Live</h1>
        </div>
        <div id="room-info" class="hidden flex items-center space-x-4 text-sm">
            <span class="bg-gray-800 px-3 py-1 rounded-full border border-gray-700">Sala: <strong id="lbl-room" class="text-emerald-400"></strong></span>
            <span class="bg-gray-800 px-3 py-1 rounded-full border border-gray-700">Jugador: <strong id="lbl-player" class="text-amber-400"></strong></span>
            <button onclick="leaveRoom()" class="bg-red-600/80 hover:bg-red-600 text-white px-3 py-1 rounded font-semibold transition">Salir</button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow p-4 max-w-6xl mx-auto w-full">

        <!-- LOBBY SCREEN -->
        <div id="screen-lobby" class="max-w-md mx-auto bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl mt-10">
            <h2 class="text-xl font-bold text-center mb-6 text-emerald-400">Gestor de Fichas de Poker</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Tu Apodo</label>
                    <input type="text" id="input-name" placeholder="Ej. Ismael" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Fichas Iniciales (Buy-in)</label>
                    <select id="select-buyin" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
                        <option value="50">50 Fichas</option>
                        <option value="100" selected>100 Fichas</option>
                        <option value="200">200 Fichas</option>
                        <option value="500">500 Fichas</option>
                        <option value="1000">1000 Fichas</option>
                        <option value="5000">5000 Fichas</option>
                    </select>
                </div>

                <div class="pt-4 border-t border-gray-800 flex flex-col space-y-3">
                    <button onclick="createRoom()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-3 rounded-lg shadow transition">Crear Nueva Sala</button>
                    <div class="flex space-x-2">
                        <input type="text" id="input-room-code" placeholder="Código de Sala" class="w-1/2 bg-gray-950 border border-gray-700 rounded-lg p-3 text-white uppercase tracking-widest text-center focus:outline-none focus:border-emerald-500">
                        <button onclick="joinRoom()" class="w-1/2 bg-gray-800 hover:bg-gray-700 text-emerald-400 border border-emerald-500/50 font-bold p-3 rounded-lg shadow transition">Unirse</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- GAME INTERFACE (HIDDEN BY DEFAULT) -->
        <div id="screen-game" class="hidden space-y-6">
            
            <!-- MODE SWITCHER TABS -->
            <div class="flex justify-center space-x-2 bg-gray-900 p-1.5 rounded-xl border border-gray-800 max-w-md mx-auto">
                <button onclick="switchMode('table')" id="btn-mode-table" class="flex-1 py-2 px-4 rounded-lg font-bold text-sm bg-emerald-600 text-white transition">🟢 Modo Mesa</button>
                <button onclick="switchMode('chips')" id="btn-mode-chips" class="flex-1 py-2 px-4 rounded-lg font-bold text-sm text-gray-400 hover:text-white transition">🪙 Modo Fichas & Acciones</button>
            </div>

            <!-- TABLE VIEW -->
            <div id="view-table" class="felt-bg border-4 border-amber-900/60 rounded-3xl p-6 shadow-2xl min-h-[450px] relative flex flex-col items-center justify-between">
                <div class="bg-black/40 backdrop-blur border border-white/10 px-6 py-2 rounded-full text-center">
                    <p class="text-xs uppercase text-emerald-300 font-bold">Bote Acumulado en la Mesa</p>
                    <p id="pot-display" class="text-3xl font-black text-amber-400">0 fichas</p>
                </div>

                <!-- PLAYERS SEATS GRID -->
                <div id="table-seats" class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full my-6">
                    <!-- Generado dinámicamente -->
                </div>

                <div class="text-center text-xs text-emerald-200/60 bg-black/30 px-4 py-1.5 rounded-lg">
                    ℹ️ Las cartas se reparten de forma presencial. Esta pantalla lleva el control de ciegas, apuestas y fichas.
                </div>
            </div>

            <!-- CHIPS & ACTIONS VIEW -->
            <div id="view-chips" class="hidden bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl max-w-2xl mx-auto space-y-6">
                <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                    <div>
                        <p class="text-xs uppercase text-gray-400">Tus Fichas Actuales (Stack)</p>
                        <p id="my-chips-display" class="text-3xl font-black text-emerald-400">100</p>
                    </div>
                    <div>
                        <p class="text-xs uppercase text-gray-400">Tu Apuesta Actual</p>
                        <p id="my-bet-display" class="text-3xl font-black text-amber-400">0</p>
                    </div>
                </div>

                <!-- ACTION BUTTONS -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <button onclick="playerAction('fold')" class="bg-red-600 hover:bg-red-500 font-bold p-3 rounded-lg text-white transition">Irse (Fold)</button>
                    <button onclick="playerAction('check')" class="bg-blue-600 hover:bg-blue-500 font-bold p-3 rounded-lg text-white transition">Pasar (Check)</button>
                    <button onclick="playerAction('call')" class="bg-amber-600 hover:bg-amber-500 font-bold p-3 rounded-lg text-white transition">Igualar (Call)</button>
                    <button onclick="playerAction('allin')" class="bg-purple-600 hover:bg-purple-500 font-bold p-3 rounded-lg text-white transition">All-In 🔥</button>
                </div>

                <!-- RAISE CONTROLS -->
                <div class="flex space-x-2 pt-2">
                    <input type="number" id="raise-amount" value="10" min="1" class="w-2/3 bg-gray-950 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
                    <button onclick="playerAction('raise')" class="w-1/3 bg-emerald-600 hover:bg-emerald-500 font-bold p-3 rounded-lg text-white transition">Subir (Raise)</button>
                </div>

                <!-- PLAYER LIST -->
                <div class="border-t border-gray-800 pt-4">
                    <h3 class="text-sm font-bold text-gray-400 mb-3">Estado de la Mesa en Tiempo Real</h3>
                    <div id="players-list-chips" class="space-y-2">
                        <!-- Generado dinámicamente -->
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- FOOTER SCRIPT DE SINCRONIZACIÓN -->
    <script>
        let gameState = {
            roomCode: null,
            playerName: null,
            buyIn: 100,
            players: [],
            pot: 0
        };

        function generateCode() {
            return Math.random().toString(36.substring(2, 6)).toUpperCase().slice(-4);
        }

        function createRoom() {
            const name = document.getElementById('input-name').value.trim();
            if (!name) { alert('Por favor ingresá tu apodo'); return; }
            
            gameState.playerName = name;
            gameState.buyIn = parseInt(document.getElementById('select-buyin').value);
            gameState.roomCode = "MESA-" + generateCode();
            
            gameState.players = [{
                name: name,
                chips: gameState.buyIn,
                bet: 0,
                status: 'Activo'
            }];

            saveAndEnter();
        }

        function joinRoom() {
            const name = document.getElementById('input-name').value.trim();
            const code = document.getElementById('input-room-code').value.trim().toUpperCase();
            if (!name || !code) { alert('Ingresá tu apodo y el código de sala'); return; }

            gameState.playerName = name;
            gameState.roomCode = code;

            let loaded = localStorage.getItem('poker_room_' + code);
            if (loaded) {
                gameState = JSON.parse(loaded);
                // Chequear si ya está
                let existing = gameState.players.find(p => p.name === name);
                if (!existing) {
                    gameState.players.push({ name: name, chips: gameState.buyIn || 100, bet: 0, status: 'Activo' });
                }
            } else {
                gameState.buyIn = 100;
                gameState.players = [{ name: name, chips: 100, bet: 0, status: 'Activo' }];
            }

            saveAndEnter();
        }

        function saveAndEnter() {
            localStorage.setItem('poker_room_' + gameState.roomCode, JSON.stringify(gameState));
            
            document.getElementById('screen-lobby').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            document.getElementById('room-info').classList.remove('hidden');
            
            document.getElementById('lbl-room').innerText = gameState.roomCode;
            document.getElementById('lbl-player').innerText = gameState.playerName;

            updateUI();
            setInterval(pollRoom, 1000); // Sincronización en vivo local
        }

        function pollRoom() {
            if (!gameState.roomCode) return;
            let loaded = localStorage.getItem('poker_room_' + gameState.roomCode);
            if (loaded) {
                gameState = JSON.parse(loaded);
                updateUI();
            }
        }

        function syncAndSave() {
            localStorage.setItem('poker_room_' + gameState.roomCode, JSON.stringify(gameState));
            updateUI();
        }

        function switchMode(mode) {
            if (mode === 'table') {
                document.getElementById('view-table').classList.remove('hidden');
                document.getElementById('view-chips').classList.add('hidden');
                document.getElementById('btn-mode-table').className = "flex-1 py-2 px-4 rounded-lg font-bold text-sm bg-emerald-600 text-white transition";
                document.getElementById('btn-mode-chips').className = "flex-1 py-2 px-4 rounded-lg font-bold text-sm text-gray-400 hover:text-white transition";
            } else {
                document.getElementById('view-table').classList.add('hidden');
                document.getElementById('view-chips').classList.remove('hidden');
                document.getElementById('btn-mode-chips').className = "flex-1 py-2 px-4 rounded-lg font-bold text-sm bg-emerald-600 text-white transition";
                document.getElementById('btn-mode-table').className = "flex-1 py-2 px-4 rounded-lg font-bold text-sm text-gray-400 hover:text-white transition";
            }
        }

        function playerAction(action) {
            let p = gameState.players.find(x => x.name === gameState.playerName);
            if (!p) return;

            let raiseVal = parseInt(document.getElementById('raise-amount').value) || 10;

            if (action === 'fold') {
                p.status = 'Retirado (Fold)';
            } else if (action === 'check') {
                p.status = 'Pasó (Check)';
            } else if (action === 'call') {
                p.status = 'Igualó (Call)';
            } else if (action === 'allin') {
                p.bet += p.chips;
                gameState.pot += p.chips;
                p.chips = 0;
                p.status = '🔥 ALL-IN!';
            } else if (action === 'raise') {
                if (p.chips < raiseVal) { alert('No tenés tantas fichas'); return; }
                p.chips -= raiseVal;
                p.bet += raiseVal;
                gameState.pot += raiseVal;
                p.status = `Subió +${raiseVal}`;
            }

            syncAndSave();
        }

        function updateUI() {
            document.getElementById('pot-display').innerText = gameState.pot + " fichas";
            
            let me = gameState.players.find(x => x.name === gameState.playerName) || { chips: 0, bet: 0 };
            document.getElementById('my-chips-display').innerText = me.chips;
            document.getElementById('my-bet-display').innerText = me.bet;

            // Render table seats
            let seatsHtml = '';
            gameState.players.forEach(p => {
                seatsHtml += `
                    <div class="bg-gray-900/90 border border-emerald-500/30 rounded-xl p-3 text-center shadow">
                        <p class="font-bold text-emerald-400 truncate">${p.name}</p>
                        <p class="text-xs text-amber-400 font-semibold">${p.chips} fichas</p>
                        <p class="text-[10px] bg-gray-950/60 rounded px-1 mt-1 text-gray-300">Apuesta: ${p.bet}</p>
                        <p class="text-[10px] text-gray-400 mt-0.5">${p.status}</p>
                    </div>
                `;
            });
            document.getElementById('table-seats').innerHTML = seatsHtml;

            // Render chips list view
            let listHtml = '';
            gameState.players.forEach(p => {
                listHtml += `
                    <div class="flex justify-between items-center bg-gray-950 p-3 rounded-lg border border-gray-800 text-sm">
                        <span class="font-bold text-white">${p.name}</span>
                        <div class="space-x-3 text-xs">
                            <span class="text-amber-400 font-semibold">Fichas: ${p.chips}</span>
                            <span class="text-gray-400">Apuesta: ${p.bet}</span>
                            <span class="bg-gray-800 px-2 py-1 rounded text-emerald-300">${p.status}</span>
                        </div>
                    </div>
                `;
            });
            document.getElementById('players-list-chips').innerHTML = listHtml;
        }

        function leaveRoom() {
            gameState.roomCode = null;
            location.reload();
        }
    </script>
</body>
</html>
